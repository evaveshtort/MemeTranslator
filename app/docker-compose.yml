services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  ocr_service:
    build:
      context: .
      dockerfile: ocr_module/Dockerfile
    volumes:
      - ./ocr_module:/app/ocr_module

  vision_service:
    build:
      context: .
      dockerfile: vision_module/Dockerfile
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./vision_module:/app/vision_module

  translate_service:
    build:
      context: .
      dockerfile: translate_module/Dockerfile
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./translate_module:/app/translate_module

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memedb
      POSTGRES_USER: meme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - ocr_service
      - vision_service
      - translate_service
      - postgres
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - DATABASE_URL=postgresql+asyncpg://meme:${POSTGRES_PASSWORD}@postgres:5432/memedb
    volumes:
      - ./api:/app/api

volumes:
  ollama_data:
  postgres_data: