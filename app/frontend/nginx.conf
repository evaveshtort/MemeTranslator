server {
    listen 80;
    server_name meme-translator.ru www.meme-translator.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name meme-translator.ru www.meme-translator.ru;

    ssl_certificate     /etc/letsencrypt/live/meme-translator.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meme-translator.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
